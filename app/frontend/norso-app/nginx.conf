server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-lived cache for hashed assets, no-cache for index.html
    location ~* \.(?:mjs|js|css|woff2?|ttf|eot|ico|png|jpg|gif|svg|webp)$ {
        types {
            application/javascript mjs js;
            text/css css;
            font/woff woff;
            font/woff2 woff2;
            font/ttf ttf;
            application/vnd.ms-fontobject eot;
            image/x-icon ico;
            image/png png;
            image/jpeg jpg jpeg;
            image/gif gif;
            image/svg+xml svg;
            image/webp webp;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
